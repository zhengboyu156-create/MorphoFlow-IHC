[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morphoflow-ihc"
version = "0.1.0"
description = "Paired morphology-conditioned flow matching and trajectory optimization for virtual IHC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.7,<3", "torchcfm>=1.0,<2", "torchdiffeq>=0.2.5,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
morphoflow-ihc = "morphoflow_ihc.cli:main"

[tool.setuptools.packages.find]
include = ["morphoflow_ihc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
